name: Daily update

on:
  schedule:
    # Mon–Fri 04:07 UTC (06:07 Helsinki in winter, 07:07 in summer) + a midday refresh
    - cron: "7 4 * * 1-5"
    - cron: "37 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Leaflet
        run: npm install --no-save leaflet@1.9.4
      - name: Read menu addresses sent through the site form
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, url FROM suggestions WHERE status != 'rejected' ORDER BY id" > data/suggestions_raw.json
      - name: Fetch lunch lists and build site
        env:
          PUBLIC: ${{ vars.PUBLIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 -I pipeline/daily.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name paivanlounas --branch main --commit-dirty=true

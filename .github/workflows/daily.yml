name: Daily update

on:
  schedule:
    # Mon–Fri 04:07 UTC (06:07 Helsinki in winter, 07:07 in summer) + a midday refresh
    - cron: "7 4 * * 1-5"
    - cron: "37 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Leaflet
        run: npm install --no-save leaflet@1.9.4
      - name: Read menu addresses sent through the site form
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, url FROM suggestions WHERE status != 'rejected' ORDER BY id" > data/suggestions_raw.json
      - name: Read "wrong info" reports
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, day, count(*) AS n FROM reports WHERE day >= date('now', '-7 days') GROUP BY venue, day" > data/reports_raw.json
      - name: Restore AI reader cache
        uses: actions/cache/restore@v4
        with:
          path: data/ai_cache.json
          key: ai-cache-${{ github.run_id }}
          restore-keys: ai-cache-
      - name: Fetch lunch lists and build site
        env:
          PUBLIC: ${{ vars.PUBLIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # morning run may spend up to $0.12 on new readings, the midday refresh and code pushes less
          LOUNAS_AI_BUDGET: ${{ github.event.schedule == '7 4 * * 1-5' && '0.12' || github.event.schedule == '37 8 * * 1-5' && '0.03' || '0.05' }}
        run: python3 -I pipeline/daily.py
      - name: Save AI reader cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/ai_cache.json
          key: ai-cache-${{ github.run_id }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name paivanlounas --branch main --commit-dirty=true

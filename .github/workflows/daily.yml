name: Daily update

on:
  schedule:
    # Mon–Fri 04:07 UTC (06:07 Helsinki in winter, 07:07 in summer) + a midday refresh
    - cron: "17 2 * * 1-5"   # main morning run (04.17 / 05.17 Finnish time) – GitHub often starts cron 30–70 min late
    - cron: "7 4 * * 1-5"    # backup / refresh (restaurants that publish in the early morning)
    - cron: "37 8 * * 1-5"   # midday refresh
  workflow_dispatch:
    inputs:
      morning:
        description: "1 = morning rescue run started by the Cloudflare morning check (N41): full morning AI budget"
        required: false
        default: ""
  push:
    branches: [main, "test/**"]   # test/** = full run without deploy or cache saves (try changes with real data)

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install image tools (share pictures)
        run: pip install --quiet pillow fonttools
      - name: Install Leaflet
        run: npm install --no-save leaflet@1.9.4 @fontsource/inter@5 @fontsource/bricolage-grotesque@5 maplibre-gl@5 @maplibre/maplibre-gl-leaflet@0.1
      - name: Read menu addresses sent through the site form
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, url FROM suggestions WHERE status != 'rejected' ORDER BY id" > data/suggestions_raw.json
      - name: Read "wrong info" reports
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, day, count(*) AS n FROM reports WHERE day >= date('now', '-7 days') GROUP BY venue, day" > data/reports_raw.json
      - name: Restore AI reader cache
        uses: actions/cache/restore@v4
        with:
          path: data/ai_cache.json
          key: ai-cache-${{ github.run_id }}
          restore-keys: ai-cache-
      - name: Read likes (most popular, last 30 days)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT venue, sum(CASE kind WHEN 'fav' THEN 2 ELSE 1 END) AS n FROM likes WHERE day >= date('now', '-30 days') GROUP BY venue" > data/likes_raw.json
      - name: Read search landings (index gate)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --json --command "SELECT DISTINCT key FROM counters WHERE kind = 'land' AND day >= date('now', '-60 days')" > data/landed_raw.json
      - name: Restore index-gate state (last menu day per restaurant, sitemap lastmod)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/menu_seen.json
            data/lastmod.json
            data/price_history.json
            data/lists_history.json
            data/lunch_info.json
            data/info_cache.json
          key: gate-${{ github.run_id }}
          restore-keys: gate-
      - name: Restore last fetched lists (code pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/menus_*.json
            data/ai_stats.json
            data/web_pages.json
            raw/raf_hki_parsed.json
          key: lists-${{ github.run_id }}
          restore-keys: lists-
      - name: Fetch lunch lists and build site
        env:
          QUICK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
          LOUNAS_GATE: "1"   # index gate on (Branu 26.11.: decide what works best, never drop what people search)
          PUBLIC: "1"  # site open to search engines since 24.11.2026
          ADSENSE_CLIENT: ca-pub-1421922359984193
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOUNAS_INFO_BUDGET: ${{ github.event.schedule == '37 8 * * 1-5' && '0.02' || '0.04' }}  # N46 lunch facts, new readings only
          # morning run may spend up to $0.12 on new readings, the midday refresh and code pushes less
          LOUNAS_AI_BUDGET: ${{ (github.event.schedule == '17 2 * * 1-5' || inputs.morning == '1') && '0.23' || github.event.schedule == '37 8 * * 1-5' && '0.03' || '0.05' }}
        run: python3 -I pipeline/daily.py
      - name: Quality gate (lists >= 80 % of usual, N41)
        id: gate
        run: python3 -I pipeline/quality_gate.py
      - name: Alert when lists are thin
        if: steps.gate.outputs.alert != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.gate.outputs.alert }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Lounaslistat vajaat $(date +%d.%m.)" --body "${ALERT} Ajo ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
      - name: Save AI reader cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: data/ai_cache.json
          key: ai-cache-${{ github.run_id }}
      - name: Save index-gate state
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            data/menu_seen.json
            data/lastmod.json
            data/price_history.json
            data/lists_history.json
            data/lunch_info.json
            data/info_cache.json
          key: gate-${{ github.run_id }}
      - name: Save fetched lists
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            data/menus_*.json
            data/ai_stats.json
            data/web_pages.json
            raw/raf_hki_parsed.json
          key: lists-${{ github.run_id }}
      - name: Smoke test before deploy (fails = the old site stays live)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python tests/smoke.py dist
      - name: Smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screens
          path: smoke-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: D1 schema (idempotent)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute paivanlounas --remote --file schema.sql
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.deploy == '1' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name paivanlounas --branch main --commit-dirty=true
      - name: Test branch output (lunch facts, pages with the N46 box)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p testout
          cp data/lunch_info.json testout/ 2>/dev/null || true
          grep -l 'class="lunchinfo"' dist/ravintola/*/index.html | head -40 | xargs -r cp --parents -t testout
          grep -c '<loc>' dist/sitemap.xml > testout/sitemap_count.txt || true
      - name: Upload test branch output
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: testout
          retention-days: 3

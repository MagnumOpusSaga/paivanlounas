# Adds or refreshes one city's venue registry (Branu 27.11.2026: expand to all of Finland, a little every day).
# Run: Actions → Build city → city key (pipeline/cities.py). Commits data/registry_<city>.json + data/areas_<city>.json;
# the push then rebuilds the site. A new city's pages stay noindex until it is added to LOUNAS_INDEX_CITIES in daily.yml.
name: Build city
on:
  workflow_dispatch:
    inputs:
      city:
        description: "city key in pipeline/cities.py (e.g. espoo)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build registry
        run: python3 -I pipeline/build_city.py "${{ inputs.city }}"
      - name: Commit
        run: |
          git config user.name "paivanlounas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/registry_${{ inputs.city }}.json" "data/areas_${{ inputs.city }}.json"
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Registry ${{ inputs.city }}: $(python3 -c "import json;print(len(json.load(open('data/registry_${{ inputs.city }}.json'))))") places (Build city)"
          git push

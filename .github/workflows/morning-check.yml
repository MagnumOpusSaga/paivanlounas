name: Deploy morning check worker (N41)

# Deploys workers/morning-check to Cloudflare: cron 05.30 / 06.30 Helsinki time, starts "Daily update" if today's lists are not online.
# Needs repo secret GH_DISPATCH_TOKEN (fine-grained token, this repo only, Actions: write + Issues: write) -> Worker secret GH_TOKEN.
on:
  push:
    branches: [main]
    paths: ["workers/morning-check/**", ".github/workflows/morning-check.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy worker
        working-directory: workers/morning-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
      - name: Give the worker its GitHub token
        working-directory: workers/morning-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "::warning::GH_DISPATCH_TOKEN secret missing - the worker can check but cannot start the workflow"
          else
            printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@3 secret put GH_TOKEN
          fi
